name: Release

on:
  push:
    # Version tags only: v0.1.0, v0.2.0-rc.1. The gate action's major tag
    # (v1) is not a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Or release from the Actions tab: the release creates its tag on the
  # commit the workflow runs on.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create and release, e.g. v0.1.0 (must match Cargo.toml)
        required: true
      gate_tag:
        description: Major tag of the gate action to point at this commit (leave empty to keep it)
        default: v1

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          # C dependencies (ring) build with musl-gcc on either architecture.
          t=$(echo "${{ matrix.target }}" | tr - _)
          echo "CC_$t=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_$t=ar" >> "$GITHUB_ENV"
      - name: Check the tag matches the version
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' || { echo "$TAG is not a version tag"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="baste") | .version')
          test "v$version" = "$TAG" || { echo "tag $TAG != v$version"; exit 1; }
      - run: cargo build --release --target ${{ matrix.target }} -p baste
      - name: Check the binary is static (it doubles as the in-VM agent)
        run: |
          bin=target/${{ matrix.target }}/release/baste
          file "$bin"
          file "$bin" | grep -Eq "statically linked|static-pie linked"
          "$bin" --version
      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/baste-$TAG-${{ matrix.target }}.tar.gz" baste
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist

  macos:
    name: Build aarch64-apple-darwin
    needs: linux
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p baste
      - uses: actions/download-artifact@v4
        with:
          name: aarch64-unknown-linux-musl
          path: linux
      - name: Package (with the Linux agent the VMs run)
        run: |
          mkdir -p stage dist
          tar -xzf linux/*.tar.gz -C stage
          mv stage/baste stage/baste-linux-aarch64
          cp target/release/baste stage/baste
          tar -C stage -czf "dist/baste-$TAG-aarch64-apple-darwin.tar.gz" baste baste-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: dist

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: inputs.gate_tag != ''
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
      - name: Point the gate action's major tag at this release
        if: inputs.gate_tag != ''
        env:
          GATE_TAG: ${{ inputs.gate_tag }}
        run: |
          git tag -f "$GATE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$GATE_TAG"

  npm:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
