name: npm

# Publishes a GitHub release's binaries to npm as @weftsh/baste plus one
# package per platform. It starts on its own when a Release run succeeds;
# run it by hand with a tag to (re)publish an existing release. Versions
# already on npm are skipped, so re-running is safe.
#
# Publishing uses npm Trusted Publishing: no npm token is stored. Each
# package's settings on npmjs.com trust this workflow (GitHub Actions,
# Weftsh/baste, npm.yml, no environment), and npm authenticates each run
# through GitHub's OIDC token. This is the only workflow that publishes.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Released version tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Find the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          tag=$INPUT_TAG
          if [ -z "$tag" ]; then
            # The Release run records the tag it published.
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-tag --dir release-tag
            tag=$(cat release-tag/tag)
          fi
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' || { echo "'$tag' is not a version tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $tag"
      - name: Download the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern '*.tar.gz' --pattern SHA256SUMS
          cd release && sha256sum -c SHA256SUMS
      - name: Build the packages
        run: node npm/build.mjs "$TAG" release dist | tee order.txt
      - name: Check each package trusts this workflow (Trusted Publishing)
        run: |
          # The same exchange npm publish does: GitHub's OIDC token for a
          # short-lived npm token. Doing it first means a settings problem
          # stops the run before anything is published, with npm's reason.
          # The npm token isn't printed.
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          # What npm compares with each package's Trusted Publisher settings.
          node -e '
            const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url"));
            console.log(`This run, as npm sees it: owner "${c.repository_owner}", repository "${c.repository}", ` +
              `workflow "${c.workflow_ref}", environment "${c.environment || ""}"`);
          ' "$id_token"
          untrusted=0
          while read -r dir; do
            name=$(node -p "require('./$dir/package.json').name")
            status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")
            if [ "$status" = 200 ] || [ "$status" = 201 ]; then
              echo "$name: trusted"
            else
              echo "::error::$name doesn't trust this workflow (HTTP $status): $(jq -c 'del(.token)' exchange.json 2>/dev/null || cat exchange.json)"
              untrusted=1
            fi
            rm -f exchange.json
          done < order.txt
          if [ "$untrusted" = 1 ]; then
            echo "On npmjs.com, each package's Trusted Publisher must be: GitHub Actions, Weftsh / baste, npm.yml, no environment"
            exit 1
          fi
      - name: Publish
        run: |
          # Pre-releases (v0.2.0-rc.1) go to the "next" dist-tag, not "latest".
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          # Whether npm can serve name@version yet (the registry, no auth).
          available() {
            curl -fsS -o /dev/null "https://registry.npmjs.org/${1/\//%2f}/$2" 2>/dev/null
          }
          publish() {
            local name version
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            if available "$name" "$version"; then
              echo "$name@$version is already on npm"
              return
            fi
            (cd "$1" && npm publish --provenance --access public --tag "$dist_tag")
          }
          # order.txt lists the platform packages, then the launcher.
          launcher=$(tail -n 1 order.txt)
          while read -r dir; do publish "$dir"; done < <(head -n -1 order.txt)
          # npm takes a few minutes to process a new version before it can be
          # installed. Publish the launcher only once every platform package
          # it depends on installs, so nobody gets the launcher on its own.
          while read -r dir; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            for attempt in $(seq 1 60); do
              available "$name" "$version" && break
              [ "$attempt" = 60 ] && { echo "$name@$version still isn't available after 15 minutes"; exit 1; }
              sleep 15
            done
            echo "$name@$version is available"
          done < <(head -n -1 order.txt)
          publish "$launcher"
