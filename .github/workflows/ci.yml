name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Gate action
        run: gate/test.sh

  macos:
    name: Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  vm-smoke:
    name: VM guest (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The guest for this machine's architecture: x86_64 on GitHub, aarch64
      # when Baste runs this job on an Apple Silicon Mac.
      - name: Pick the guest architecture
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) qemu=qemu-system-x86
              kernel_sha=b36a4a1b10f33b9cfdcde3d1a787d9c090556a3edb211cd06d1f3f9a6c7e8724
              rootfs_sha=2332f3bb101fc8645c6322c7445acd353a51845a33e66b58c711905d685b2aa7 ;;
            aarch64) qemu=qemu-system-arm
              kernel_sha=69aa3308219ec1a070bc9a8e7f80c3b34056fed8ae05efb44e55f73b31adde44
              rootfs_sha=4fd59b607fd17fd711835ffb95e8d14fc49c64bdf5e57d4ca6051dd9b2aa5091 ;;
            *) echo "no guest for $arch"; exit 1 ;;
          esac
          target="$arch-unknown-linux-musl"
          {
            echo "ARCH=$arch"
            echo "TARGET=$target"
            echo "QEMU_PACKAGE=$qemu"
            echo "KERNEL_SHA=$kernel_sha"
            echo "ROOTFS_SHA=$rootfs_sha"
            echo "CC_$(echo "$target" | tr - _)=musl-gcc"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends "$QEMU_PACKAGE" musl-tools e2fsprogs
      - run: cargo build --release --target "$TARGET" -p baste
      - name: Download the pinned kernel and rootfs
        run: |
          base="https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.13/$ARCH"
          curl -fsSLo vmlinux "$base/vmlinux-6.1.141"
          curl -fsSLo rootfs.squashfs "$base/ubuntu-24.04.squashfs"
          printf '%s  vmlinux\n%s  rootfs.squashfs\n' "$KERNEL_SHA" "$ROOTFS_SHA" | sha256sum -c
      - run: scripts/qemu-smoke.sh "target/$TARGET/release/baste" vmlinux rootfs.squashfs

  firecracker:
    name: Firecracker end to end (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # This machine's architecture: x86_64 on GitHub, aarch64 when Baste runs
      # the job on an Apple Silicon Mac (whose VMs get KVM from nested
      # virtualization on M3 and later).
      - name: Pick the architecture
        run: |
          target="$(uname -m)-unknown-linux-musl"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "CC_$(echo "$target" | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools e2fsprogs jq
      - run: cargo build --release --target "$TARGET" -p baste
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Set up VM networking
        run: sudo "target/$TARGET/release/baste" setup-network --user "$USER" --slots 2
      - name: Run a workflow in Firecracker VMs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/firecracker-e2e.sh "target/$TARGET/release/baste"
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p debug
          cp -r /tmp/tmp.*/repo/.git/baste debug/ 2>/dev/null || true
          find ~/.cache/baste ~/.local/state/baste -name '*.log' -exec cp {} debug/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firecracker-debug
          path: debug

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: npm packaging scripts parse
        working-directory: .
        run: node --check npm/baste/bin/baste.js && node --check npm/build.mjs
